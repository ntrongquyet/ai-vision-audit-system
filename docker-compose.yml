services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: audit
    ports: ["5432:5432"]
    volumes: ["pgdata:/var/lib/postgresql/data"]
  adminer:
    image: adminer
    ports: ["8080:8080"]
    depends_on: [db]
volumes:
  pgdata:
