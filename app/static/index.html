<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>AI Vision Audit System</title>
  <link rel="stylesheet" href="/styles.css" />
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <div class="logo">AV</div>
      <div>
        <h1>AI Vision Audit System</h1>
        <p class="tagline">Cross-check site photos against the Scope of Works</p>
      </div>
    </div>
    <span class="env-badge ok" id="connState">Ready</span>
  </header>

  <main class="container">

    <!-- 1. Upload & Index -->
    <section class="card">
      <div class="card-head">
        <span class="step">1</span>
        <h2>Upload &amp; Index Photos</h2>
      </div>
      <div class="dropzone" id="dropzone" onclick="document.getElementById('files').click()">
        <input type="file" id="files" accept="image/*" multiple hidden />
        <p><strong>Click to choose</strong> or drag &amp; drop site photos</p>
        <p class="muted" id="fileCount">No files selected</p>
      </div>
      <div class="actions">
        <button class="btn primary" id="indexBtn" onclick="uploadAndIndex()">Upload &amp; Index</button>
        <button class="btn ghost" id="refreshBtn" onclick="refreshStatus()">Refresh status</button>
      </div>
      <div class="status-panel hidden" id="statusPanel">
        <div class="status-row">
          <span class="status-badge" id="statusBadge">pending</span>
          <span class="muted" id="statusCounts"></span>
        </div>
        <div class="progress"><div class="progress-bar" id="progressBar"></div></div>
      </div>
    </section>

    <!-- 2. Audit -->
    <section class="card">
      <div class="card-head">
        <span class="step">2</span>
        <h2>Run AI Audit</h2>
      </div>
      <div class="editor">
        <div class="editor-toolbar">
          <div class="tabs">
            <button type="button" class="tab active" id="tabEdit" onclick="setScopeTab('edit')">Edit</button>
            <button type="button" class="tab" id="tabPreview" onclick="setScopeTab('preview')">Preview</button>
          </div>
          <div class="editor-import">
            <input type="file" id="docFile" accept=".pdf,image/*" hidden />
            <button type="button" class="btn ghost sm" id="importBtn"
                    onclick="document.getElementById('docFile').click()">⤓ Import PDF / Image</button>
          </div>
        </div>
        <textarea id="scope" rows="10"
          placeholder="Paste the Scope of Works (Markdown supported), or import a PDF/image to extract the text..."></textarea>
        <div id="scopePreview" class="md-preview hidden"></div>
      </div>
      <div class="actions">
        <button class="btn primary" id="auditBtn" onclick="runAudit()">Run AI Audit</button>
      </div>
      <div id="report" class="report"></div>
    </section>

  </main>

  <div id="toast" class="toast hidden"></div>

  <div id="lightbox" class="lightbox hidden" onclick="closeLightbox()">
    <span class="lightbox-close" aria-label="Close">&times;</span>
    <img id="lightboxImg" src="" alt="full size evidence" onclick="event.stopPropagation()" />
  </div>

  <script src="/app.js"></script>
</body>
</html>
